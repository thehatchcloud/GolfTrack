[project]
name = "golftrack"
version = "0.1.0"
description = "Simple golf game tracker — Django + Django Ninja + Tailwind CSS"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
    "django-ninja>=1.4,<2.0",
    "django-allauth[socialaccount]>=65.0",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations", "node_modules", ".next"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-p no:cacheprovider"
