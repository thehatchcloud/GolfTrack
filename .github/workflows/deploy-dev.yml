name: Dev Deploy

# Builds a Docker image from Dockerfile.django and deploys any non-main branch
# to golftrack-dev.exe.xyz for testing. No OAuth — sign in with email+password.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy ${{ github.ref_name }} to dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://golftrack-dev.exe.xyz:8000
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DEV_DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEV_DEPLOY_SSH_KEY }}" ]; then
            echo "DEV_DEPLOY_HOST or DEV_DEPLOY_SSH_KEY not set — skipping deploy."
            echo "Follow DEPLOYMENT.md §'Dev server setup' to configure the dev server."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.django
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/golftrack:django-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH deploy
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          envs: OWNER,GHCR_TOKEN,DJANGO_SECRET_KEY,ADMIN_EMAILS,BRANCH
          script: |
            set -e
            IMAGE="ghcr.io/${OWNER}/golftrack:django-dev"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
            docker pull "$IMAGE"

            docker stop golftrack-dev 2>/dev/null || true
            docker rm   golftrack-dev 2>/dev/null || true

            docker run -d \
              --name golftrack-dev \
              --restart unless-stopped \
              -p 8000:8000 \
              -e DATABASE_URL="file:/data/dev.db" \
              -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
              -e DJANGO_DEBUG=true \
              -e DJANGO_ALLOWED_HOSTS="golftrack-dev.exe.xyz" \
              -e DJANGO_CSRF_TRUSTED_ORIGINS="https://golftrack-dev.exe.xyz:8000" \
              -e ADMIN_EMAILS="$ADMIN_EMAILS" \
              -v golftrack-dev-data:/data \
              "$IMAGE"

            docker image prune -f
            echo "Deployed branch '${BRANCH}' — https://golftrack-dev.exe.xyz:8000"
