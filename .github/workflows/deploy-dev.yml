name: Dev Deploy

# Builds the Django Docker image (the repo's Dockerfile) and deploys any
# non-main branch to golftrack-dev.exe.xyz for testing. Runs without Litestream
# (LITESTREAM_BUCKET unset). No OAuth — sign in with email+password.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy ${{ github.ref_name }} to dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://golftrack-dev.exe.xyz:8000
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DEV_DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEV_DEPLOY_SSH_KEY }}" ]; then
            echo "DEV_DEPLOY_HOST or DEV_DEPLOY_SSH_KEY not set — skipping deploy."
            echo "Follow DEPLOYMENT.md §'Dev server setup' to configure the dev server."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/golftrack:django-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # appleboy/ssh-action fetches its drone-ssh helper from GitHub releases on
      # every run, so a connection reset on the runner fails the deploy before
      # it has even reached the server ("Failed to download
      # drone-ssh-…-linux-amd64", exit 4). That is a transient runner-network
      # problem, not a deploy problem, so it gets one retry rather than a red
      # build. bin/deploy-dev.sh is safe to re-run — it stops and replaces the
      # container — and living in a file is what lets the retry reuse it
      # instead of duplicating the script.
      - name: SSH deploy
        id: deploy
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          envs: OWNER,GHCR_TOKEN,DJANGO_SECRET_KEY,ADMIN_EMAILS,BRANCH
          script_file: bin/deploy-dev.sh

      - name: SSH deploy (retry)
        if: steps.check.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          envs: OWNER,GHCR_TOKEN,DJANGO_SECRET_KEY,ADMIN_EMAILS,BRANCH
          script_file: bin/deploy-dev.sh
