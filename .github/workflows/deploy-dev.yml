name: Dev Deploy

# Deploys any non-main branch to golftrack-dev.exe.xyz for testing.
# Uses Python 3.13 + gunicorn (direct, no Docker) — no OAuth, password auth only.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy ${{ github.ref_name }} to dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://golftrack-dev.exe.xyz:8000

    steps:
      - name: Check secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DEV_DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEV_DEPLOY_SSH_KEY }}" ]; then
            echo "DEV_DEPLOY_HOST or DEV_DEPLOY_SSH_KEY not set — skipping deploy."
            echo "Follow DEPLOYMENT.md §'Dev server setup' to configure the dev server."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_DEPLOY_SSH_KEY }}" > ~/.ssh/dev_key
          chmod 600 ~/.ssh/dev_key
          ssh-keyscan -H "${{ secrets.DEV_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code
        if: steps.check.outputs.skip != 'true'
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.venv*/' \
            --exclude='*.db' \
            --exclude='staticfiles/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            -e "ssh -i ~/.ssh/dev_key" \
            ./ ubuntu@${{ secrets.DEV_DEPLOY_HOST }}:/srv/golftrack/

      - name: Install deps, migrate, collect static, restart
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          envs: DJANGO_SECRET_KEY,ADMIN_EMAILS,BRANCH
          script: |
            set -e
            cd /srv/golftrack

            # Create venv with Python 3.13 on first run
            # (pydantic is not yet compatible with Python 3.14)
            [ -d .venv ] || uv venv --python 3.13 .venv

            uv pip install --python .venv \
              "django>=6.0,<6.1" \
              "django-ninja>=1.4,<2.0" \
              "django-allauth[socialaccount]>=65.0,<66.0" \
              "python-dotenv>=1.0" \
              "whitenoise>=6.7" \
              "gunicorn>=23.0" \
              "uvicorn>=0.30"

            # Refresh env file from secrets (keeps DB path stable across deploys)
            cat > /home/ubuntu/golftrack-dev.env <<EOF
            DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
            DJANGO_DEBUG=true
            DJANGO_ALLOWED_HOSTS=golftrack-dev.exe.xyz
            DJANGO_CSRF_TRUSTED_ORIGINS=https://golftrack-dev.exe.xyz:8000
            DATABASE_URL=file:/srv/golftrack/dev.db
            ADMIN_EMAILS=${ADMIN_EMAILS}
            EOF
            chmod 600 /home/ubuntu/golftrack-dev.env

            set -a; source /home/ubuntu/golftrack-dev.env; set +a
            .venv/bin/python manage.py migrate --noinput
            DJANGO_DEBUG=false .venv/bin/python manage.py collectstatic --noinput

            sudo systemctl restart golftrack-dev
            echo "Deployed branch '${BRANCH}' — https://golftrack-dev.exe.xyz:8000"
