name: Dev Deploy

# Builds the PocketBase Docker image (pocketbase/Dockerfile) and deploys any
# non-main branch to golftrack-dev.exe.xyz for testing. Runs without Litestream
# (LITESTREAM_BUCKET unset). No OAuth — sign in with email+password
# (GOLFTRACK_ALLOW_PASSWORD_LOGIN).
#
# The Django image this used to build is no longer deployed anywhere as of the
# Phase 10 cutover (#131); bin/deploy-dev.sh removes the container it left
# behind on the dev VM.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy ${{ github.ref_name }} to dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://golftrack-dev.exe.xyz:8000
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DEV_DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEV_DEPLOY_SSH_KEY }}" ]; then
            echo "DEV_DEPLOY_HOST or DEV_DEPLOY_SSH_KEY not set — skipping deploy."
            echo "Follow DEPLOYMENT.md §'Dev server setup' to configure the dev server."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is pocketbase/ (the Go module root) — see the same step in
      # deploy.yml. The tag changes with it: the dev VM used to run
      # `:django-dev`, which stays in GHCR untouched as the dev-side rollback
      # image.
      - name: Build and push dev image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: pocketbase
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/golftrack:pocketbase-dev
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # appleboy/ssh-action fetches its drone-ssh helper from GitHub releases on
      # every run, so a connection reset on the runner fails the deploy before
      # it has even reached the server ("Failed to download
      # drone-ssh-…-linux-amd64", exit 4). That is a transient runner-network
      # problem, not a deploy problem, so it gets one retry rather than a red
      # build. bin/deploy-dev.sh is safe to re-run — it stops and replaces the
      # container — and living in a file is what lets the retry reuse it
      # instead of duplicating the script.
      - name: SSH deploy
        id: deploy
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GIT_SHA: ${{ github.sha }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          envs: OWNER,GHCR_TOKEN,GIT_SHA,ADMIN_EMAILS,BRANCH
          capture_stdout: true
          script_path: bin/deploy-dev.sh

      - name: SSH deploy (retry)
        id: deploy_retry
        if: steps.check.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        env:
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GIT_SHA: ${{ github.sha }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEV_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          envs: OWNER,GHCR_TOKEN,GIT_SHA,ADMIN_EMAILS,BRANCH
          capture_stdout: true
          script_path: bin/deploy-dev.sh

      # Same guard as the production workflow — see its comment. Reads the SSH
      # step's captured stdout rather than the public URL, because exe.dev's
      # login gate makes /api/health unreachable to an unauthenticated runner.
      - name: Verify the deploy script ran
        if: steps.check.outputs.skip != 'true'
        env:
          DEPLOY_STDOUT: ${{ steps.deploy.outputs.stdout }}${{ steps.deploy_retry.outputs.stdout }}
          GIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${GIT_SHA:0:7}"
          case "$DEPLOY_STDOUT" in
            *"is healthy and running ${short_sha}"*)
              echo "bin/deploy-dev.sh ran and confirmed ${short_sha} serving on the host."
              ;;
            *)
              echo "::error::bin/deploy-dev.sh never reported ${short_sha} healthy. The SSH step exited 0 but produced no success marker, which is what a silently-skipped script looks like. Captured stdout follows:"
              printf '%s\n' "${DEPLOY_STDOUT:-<empty>}"
              exit 1
              ;;
          esac
