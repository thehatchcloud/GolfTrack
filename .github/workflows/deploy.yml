name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: make install
      - name: Lint (ruff)
        run: make lint
      - name: Production static build (Tailwind + collectstatic)
        run: make collectstatic
      - name: Test (pytest)
        run: make test
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Python test coverage"
              echo
              .venv/bin/coverage report --format=markdown
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  pocketbase:
    name: PocketBase (Go)
    runs-on: ubuntu-latest
    # The PocketBase app in pocketbase/ is not the deployed artifact yet (that
    # is still the Django image below), so this job runs alongside `test`
    # rather than gating the build. It keeps the schema, its access rules and
    # the hooks honest while the migration in #121 is in progress.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: pocketbase/go.mod
          cache-dependency-path: pocketbase/go.sum
      - name: Check formatting (gofmt)
        working-directory: pocketbase
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: pocketbase
        run: go vet ./...
      - name: Build
        working-directory: pocketbase
        run: go build ./...
      - name: Test (schema, access rules, hooks)
        working-directory: pocketbase
        run: go test ./...

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/golftrack:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to exe.dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      # Needed for bin/deploy-prod.sh, which the SSH step reads from the runner.
      - uses: actions/checkout@v6

      # appleboy/ssh-action fetches its drone-ssh helper from GitHub releases on
      # every run, so a connection reset on the runner fails the deploy before
      # it has even reached the server ("Failed to download
      # drone-ssh-…-linux-amd64", exit 4). That is a transient runner-network
      # problem, not a deploy problem, so it gets one retry rather than a red
      # build. bin/deploy-prod.sh is safe to re-run — it stops and replaces the
      # container — and living in a file is what lets the retry reuse it
      # instead of duplicating the script.
      - name: SSH deploy
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          LITESTREAM_BUCKET: ${{ secrets.LITESTREAM_BUCKET }}
          LITESTREAM_ENDPOINT: ${{ secrets.LITESTREAM_ENDPOINT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,OWNER,GIT_SHA,LITESTREAM_ACCESS_KEY_ID,LITESTREAM_SECRET_ACCESS_KEY,LITESTREAM_BUCKET,LITESTREAM_ENDPOINT,DEPLOY_HOST,DJANGO_SECRET_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MICROSOFT_CLIENT_ID,MICROSOFT_CLIENT_SECRET,ADMIN_EMAILS
          script_path: bin/deploy-prod.sh

      - name: SSH deploy (retry)
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          LITESTREAM_BUCKET: ${{ secrets.LITESTREAM_BUCKET }}
          LITESTREAM_ENDPOINT: ${{ secrets.LITESTREAM_ENDPOINT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,OWNER,GIT_SHA,LITESTREAM_ACCESS_KEY_ID,LITESTREAM_SECRET_ACCESS_KEY,LITESTREAM_BUCKET,LITESTREAM_ENDPOINT,DEPLOY_HOST,DJANGO_SECRET_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MICROSOFT_CLIENT_ID,MICROSOFT_CLIENT_SECRET,ADMIN_EMAILS
          script_path: bin/deploy-prod.sh

      # An independent check that production is actually serving this commit.
      #
      # This exists because appleboy/ssh-action only *warns* about an unknown
      # input name and still exits 0: `script_file:` (not a real input — the
      # real one is `script_path:`) meant the action connected, ran nothing,
      # and reported success, so every deploy from 2026-07-26 until this fix
      # was a silent no-op that CI called green. Anything that verifies the
      # deploy from inside that same step can be skipped the same way, so this
      # asks the public URL instead, and fails the job if the version it
      # reports is not this commit's.
      - name: Verify production is serving this commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${GIT_SHA:0:7}"
          for attempt in $(seq 1 10); do
            response="$(curl -fsS --max-time 10 "https://${DEPLOY_HOST}:3000/api/health" || true)"
            case "$response" in
              *"$short_sha"*)
                echo "Production is serving ${short_sha}: ${response}"
                exit 0
                ;;
            esac
            echo "Attempt ${attempt}/10: /api/health reported '${response:-<unreachable>}', want version containing ${short_sha}."
            sleep 6
          done
          echo "::error::Production is not serving ${short_sha} after ~60s. Last /api/health response: '${response:-<unreachable>}'. The deploy step reported success but the running container did not change."
          exit 1
