name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Django is no longer the deployed artifact (Phase 10 cutover, #131) but its
  # code is still in-tree until Phase 11 (#132) removes it, so this keeps
  # running to catch accidental breakage during the overlap. It no longer
  # gates the image build — `build` needs `pocketbase` now.
  test:
    name: Lint, build, and test (Django, legacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - run: make install
      - name: Lint (ruff)
        run: make lint
      - name: Production static build (Tailwind + collectstatic)
        run: make collectstatic
      - name: Test (pytest)
        run: make test
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Python test coverage"
              echo
              .venv/bin/coverage report --format=markdown
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  pocketbase:
    name: PocketBase (Go)
    runs-on: ubuntu-latest
    # As of the Phase 10 cutover (#131) the PocketBase app *is* the deployed
    # artifact, so this job gates the image build below — the schema, its
    # access rules and the hooks have to be green before anything ships.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: pocketbase/go.mod
          cache-dependency-path: pocketbase/go.sum
      - name: Check formatting (gofmt)
        working-directory: pocketbase
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: pocketbase
        run: go vet ./...
      - name: Build
        working-directory: pocketbase
        run: go build ./...
      - name: Test (schema, access rules, hooks)
        working-directory: pocketbase
        run: go test ./...

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: pocketbase
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/${{ github.repository_owner }}/golftrack
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rollback anchor for the cutover (#131). Until this workflow changed,
      # `:latest` was the Django image; from here on it is the PocketBase one,
      # so the last Django build is copied to a tag of its own *before* the
      # push overwrites it. That is what makes the rollback plan a tag name
      # (bin/rollback-prod.sh) rather than "go find the right digest".
      #
      # Idempotent, and deliberately one-way: once `:django-latest` exists it
      # is never rewritten, so it keeps pointing at the final Django image
      # instead of drifting forward onto a PocketBase one on the next push.
      # `buildx imagetools`, not `docker manifest` — the latter is still gated
      # behind the experimental CLI flag on some runner images.
      - name: Preserve the Django image for rollback
        run: |
          if docker buildx imagetools inspect "$REPO:django-latest" >/dev/null 2>&1; then
            echo "$REPO:django-latest already exists — leaving it untouched."
          elif docker buildx imagetools inspect "$REPO:latest" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$REPO:django-latest" "$REPO:latest"
            echo "Copied the outgoing Django $REPO:latest to $REPO:django-latest."
          else
            echo "No $REPO:latest to preserve — nothing to do."
          fi

      # Context is pocketbase/ (the Go module root), not the repository root:
      # the PocketBase image is built from pocketbase/Dockerfile and needs
      # nothing from the Django tree. `:latest` is what bin/deploy-prod.sh
      # pulls; the commit-tagged copy is immutable, so a bad deploy can be
      # rolled forward or back to an exact PocketBase build too.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: pocketbase
          push: true
          tags: |
            ${{ env.REPO }}:latest
            ${{ env.REPO }}:pocketbase-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to exe.dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      # Needed for bin/deploy-prod.sh, which the SSH step reads from the runner.
      - uses: actions/checkout@v6

      # appleboy/ssh-action fetches its drone-ssh helper from GitHub releases on
      # every run, so a connection reset on the runner fails the deploy before
      # it has even reached the server ("Failed to download
      # drone-ssh-…-linux-amd64", exit 4). That is a transient runner-network
      # problem, not a deploy problem, so it gets one retry rather than a red
      # build. bin/deploy-prod.sh is safe to re-run — it stops and replaces the
      # container — and living in a file is what lets the retry reuse it
      # instead of duplicating the script.
      - name: SSH deploy
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          LITESTREAM_BUCKET: ${{ secrets.LITESTREAM_BUCKET }}
          LITESTREAM_ENDPOINT: ${{ secrets.LITESTREAM_ENDPOINT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,OWNER,GIT_SHA,LITESTREAM_ACCESS_KEY_ID,LITESTREAM_SECRET_ACCESS_KEY,LITESTREAM_BUCKET,LITESTREAM_ENDPOINT,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MICROSOFT_CLIENT_ID,MICROSOFT_CLIENT_SECRET,ADMIN_EMAILS
          capture_stdout: true
          script_path: bin/deploy-prod.sh

      - name: SSH deploy (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          GIT_SHA: ${{ github.sha }}
          LITESTREAM_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_ACCESS_KEY_ID }}
          LITESTREAM_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_SECRET_ACCESS_KEY }}
          LITESTREAM_BUCKET: ${{ secrets.LITESTREAM_BUCKET }}
          LITESTREAM_ENDPOINT: ${{ secrets.LITESTREAM_ENDPOINT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,OWNER,GIT_SHA,LITESTREAM_ACCESS_KEY_ID,LITESTREAM_SECRET_ACCESS_KEY,LITESTREAM_BUCKET,LITESTREAM_ENDPOINT,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MICROSOFT_CLIENT_ID,MICROSOFT_CLIENT_SECRET,ADMIN_EMAILS
          capture_stdout: true
          script_path: bin/deploy-prod.sh

      # Proof that bin/deploy-prod.sh actually ran, independent of the SSH
      # step's own exit code.
      #
      # This is the guard the `script_file:` bug needed and did not have:
      # appleboy/ssh-action only warns about an unknown input name, so it
      # connected, ran nothing, and still exited 0 for three days of "green"
      # deploys. Any check living inside the script is skipped in exactly that
      # case, so this greps the marker the script prints on success out of the
      # captured stdout — no marker means no script ran.
      #
      # It reads captured stdout rather than curling the public URL because
      # exe.dev fronts the app with its own login gate: an unauthenticated
      # runner gets a redirect to /__exe.dev/login, never /api/health.
      - name: Verify the deploy script ran
        env:
          DEPLOY_STDOUT: ${{ steps.deploy.outputs.stdout }}${{ steps.deploy_retry.outputs.stdout }}
          GIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${GIT_SHA:0:7}"
          case "$DEPLOY_STDOUT" in
            *"is healthy and running ${short_sha}"*)
              echo "bin/deploy-prod.sh ran and confirmed ${short_sha} serving on the host."
              ;;
            *)
              echo "::error::bin/deploy-prod.sh never reported ${short_sha} healthy. The SSH step exited 0 but produced no success marker, which is what a silently-skipped script looks like. Captured stdout follows:"
              printf '%s\n' "${DEPLOY_STDOUT:-<empty>}"
              exit 1
              ;;
          esac
