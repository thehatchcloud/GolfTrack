name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/golftrack:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to exe.dev
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,OWNER
          script: |
            IMAGE="ghcr.io/${OWNER}/golftrack:latest"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
            docker pull "$IMAGE"

            docker stop golftrack 2>/dev/null || true
            docker rm   golftrack 2>/dev/null || true

            mkdir -p /data/golftrack

            docker run -d \
              --name golftrack \
              --restart unless-stopped \
              -p 3000:3000 \
              -e DATABASE_URL="file:/data/prod.db" \
              -e NODE_ENV=production \
              -v /data/golftrack:/data \
              "$IMAGE"

            docker image prune -f
