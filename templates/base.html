{% load static %}
<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <meta name="theme-color" content="#047857" />
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}" />
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}" />
    <title>{% block title %}GolfTrack{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    <script src="https://unpkg.com/htmx.org@2.0.3" nonce="{{ csp_nonce }}" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" nonce="{{ csp_nonce }}" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="h-full bg-stone-50 text-slate-900 antialiased">
    <div class="mx-auto flex min-h-full max-w-2xl flex-col">
      <header class="sticky top-0 z-10 flex items-center justify-between border-b border-stone-200 bg-white px-4 py-3 shadow-sm">
        <a href="/" class="flex items-center gap-2 text-lg font-bold tracking-tight text-emerald-700">
          <span>⛳</span> GolfTrack
        </a>
        <nav class="flex items-center gap-5 text-sm">
          {% if user.is_authenticated %}
            <a href="{% url 'course_list' %}" class="text-stone-500 hover:text-stone-800">Courses</a>
            <a href="{% url 'round_list' %}" class="text-stone-500 hover:text-stone-800">Rounds</a>
            <a href="{% url 'account_logout' %}" class="text-stone-500 hover:text-stone-800">Sign out</a>
          {% else %}
            <a href="{% url 'account_login' %}" class="rounded-lg bg-emerald-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-800">Sign in</a>
          {% endif %}
        </nav>
      </header>
      <main class="flex-1 px-4 py-6">{% block content %}{% endblock %}</main>
    </div>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
