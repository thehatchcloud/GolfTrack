{% extends "base.html" %}

{% block title %}Sign-In Error – GolfTrack{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm space-y-4 py-12 text-center">
  <h1 class="text-2xl font-bold">Sign-in failed</h1>
  <p class="text-sm text-slate-500">
    There was a problem completing sign-in. Please try again.
  </p>
  <a href="{% url 'account_login' %}"
     class="inline-block rounded-lg bg-slate-800 px-6 py-2 text-sm font-medium text-white hover:bg-slate-700">
    Back to sign in
  </a>
</div>
{% endblock %}
