{% extends "base.html" %}

{% block title %}Sign Out – GolfTrack{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm space-y-6 py-12 text-center">
  <h1 class="text-2xl font-bold">Sign out?</h1>
  <p class="text-sm text-slate-500">You'll need to sign in again to track rounds.</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit"
            class="rounded-lg bg-slate-800 px-6 py-2 text-sm font-medium text-white transition hover:bg-slate-700">
      Sign out
    </button>
  </form>
  <a href="/" class="block text-sm text-slate-500 hover:underline">Cancel</a>
</div>
{% endblock %}
