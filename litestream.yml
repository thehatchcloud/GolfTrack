# The replica lives under the `django` path, separate from the Next.js app's
# abandoned replica at `prod` (#85 decision: no data migration, Litestream
# history from the old app is dropped). Keeping a distinct path means the Django
# app never restores or replicates against the old Prisma database's generations.
dbs:
  - path: /data/prod.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: django
        endpoint: ${LITESTREAM_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
