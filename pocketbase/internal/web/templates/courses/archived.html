{{define "title"}}{{.Title}}{{end}}

{{define "content"}}
<div class="mb-5 flex items-center justify-between">
  <h1 class="text-xl font-bold">Archived Courses</h1>
  <a href="/courses/" class="text-sm text-stone-500 hover:underline">← Back to courses</a>
</div>

{{if .Courses}}
  <ul class="space-y-3">
    {{range .Courses}}
      <li class="flex items-center justify-between rounded-2xl border border-stone-200 bg-white p-4 shadow-sm"
          x-data="courseArchiveActions('{{.ID}}')">
        <a href="/courses/{{.ID}}/" class="min-w-0">
          <p class="font-semibold hover:underline">{{.Name}}</p>
          <p class="text-sm text-stone-500">{{.HoleCount}} holes · par {{.TotalPar}}</p>
        </a>
        <div class="flex flex-col items-end gap-1">
          <button type="button" @click="unarchive('/courses/archived/')" :disabled="loading"
                  class="rounded-lg border border-stone-200 px-3 py-1.5 text-sm font-medium hover:bg-stone-50 disabled:opacity-60">
            Restore
          </button>
          <p x-show="error" x-text="error" x-cloak class="text-sm text-red-600"></p>
        </div>
      </li>
    {{end}}
  </ul>
{{else}}
  <p class="text-sm text-stone-500">No archived courses.</p>
{{end}}
{{end}}
