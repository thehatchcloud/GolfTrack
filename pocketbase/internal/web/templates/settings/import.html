{{define "title"}}{{.Title}}{{end}}

{{define "content"}}
<div class="mb-5 flex items-center justify-between">
  <h1 class="text-xl font-bold">Import</h1>
  <a href="/settings/" class="text-sm text-stone-500 hover:underline">Back</a>
</div>

<div x-data="roundsImport()" class="rounded-2xl border border-stone-200 bg-white p-4 shadow-sm">
  <p class="text-sm text-stone-500">
    Bring in completed rounds from another GolfTrack export, or build your own
    file from a template. Imported rounds need their course to exist here first.
  </p>
  <div class="mt-3 flex flex-wrap items-center gap-2">
    <label class="cursor-pointer rounded-lg bg-emerald-700 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-800"
           :class="importing && 'opacity-50 pointer-events-none'">
      <span x-show="!importing">Import file</span>
      <span x-show="importing" x-cloak>Importing…</span>
      <input type="file" accept=".json,.csv,application/json,text/csv" class="hidden"
             @change="importFile($event)" :disabled="importing">
    </label>
    <button type="button" @click="downloadTemplate('json')"
            class="rounded-lg border border-stone-300 px-3 py-1.5 text-sm font-medium text-stone-700 hover:border-emerald-300 hover:text-emerald-700">
      JSON template
    </button>
    <button type="button" @click="downloadTemplate('csv')"
            class="rounded-lg border border-stone-300 px-3 py-1.5 text-sm font-medium text-stone-700 hover:border-emerald-300 hover:text-emerald-700">
      CSV template
    </button>
  </div>
  <p x-show="error" x-text="error" x-cloak class="mt-2 text-sm text-red-600"></p>
  <p x-show="skipped !== null" x-cloak class="mt-2 text-sm text-stone-500">
    Nothing new to import — <span x-text="skipped"></span> round(s) were already in your history.
  </p>
</div>
{{end}}
