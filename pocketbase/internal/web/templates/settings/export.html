{{define "title"}}{{.Title}}{{end}}

{{define "content"}}
<div class="mb-5 flex items-center justify-between">
  <h1 class="text-xl font-bold">Export</h1>
  <a href="/settings/" class="text-sm text-stone-500 hover:underline">Back</a>
</div>

<div x-data="roundsExport()" class="rounded-2xl border border-stone-200 bg-white p-4 shadow-sm">
  <p class="text-sm text-stone-500">
    Download your completed rounds as a file you can keep or import into
    another GolfTrack.
  </p>
  <div class="mt-3 flex flex-wrap items-center gap-2">
    <button type="button" @click="exportRounds('json')" :disabled="exporting"
            class="rounded-lg border border-stone-300 px-3 py-1.5 text-sm font-medium text-stone-700 hover:border-emerald-300 hover:text-emerald-700 disabled:opacity-50">
      Export JSON
    </button>
    <button type="button" @click="exportRounds('csv')" :disabled="exporting"
            class="rounded-lg border border-stone-300 px-3 py-1.5 text-sm font-medium text-stone-700 hover:border-emerald-300 hover:text-emerald-700 disabled:opacity-50">
      Export CSV
    </button>
  </div>
  <p x-show="error" x-text="error" x-cloak class="mt-2 text-sm text-red-600"></p>
</div>
{{end}}
